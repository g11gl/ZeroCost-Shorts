name: Daily YouTube Short

on:
  schedule:
    # 20:17 Saudi Arabia time; GitHub runs on UTC and may delay scheduled jobs.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional Arabic lesson topic (letters, numbers, or colors)"
        required: false
        default: ""
      upload_to_youtube:
        description: "Upload as PRIVATE for review (never public)"
        type: boolean
        required: false
        default: false
      smoke_test_only:
        description: "Only run setup tests (no API keys or video needed)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  DEAPI_TOKEN: ${{ secrets.DEAPI_TOKEN }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  EDGE_TTS_VOICE: "ar-SA-ZariyahNeural"
  DEAPI_IMAGE_WIDTH: "768"
  DEAPI_IMAGE_HEIGHT: "1344"

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg and Arabic subtitle fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify kids settings before any generation or upload
        run: python -m unittest discover -s tests -v

      - name: Check generation API keys
        id: prerequisites
        run: |
          if [ -n "$GROQ_API_KEY" ] && [ -n "$DEAPI_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set GROQ_API_KEY and DEAPI_TOKEN as repository secrets to generate videos"
          fi

      # Restore story history from previous runs (prevents repeats)
      - name: Restore history cache
        if: steps.prerequisites.outputs.ready == 'true' && (github.event_name == 'schedule' || !inputs.smoke_test_only)
        uses: actions/cache/restore@v4
        with:
          path: output/history/
          key: story-history-kids_learning-${{ github.run_id }}
          restore-keys: |
            story-history-kids_learning-

      - name: Generate children's Arabic Short and optionally upload privately
        if: steps.prerequisites.outputs.ready == 'true' && (github.event_name == 'schedule' || !inputs.smoke_test_only)
        run: |
          TOPIC="${{ github.event.inputs.topic || '' }}"
          UPLOAD="${{ github.event_name == 'schedule' || inputs.upload_to_youtube }}"
          ARGS=(--channel kids_learning)

          if [ -n "$TOPIC" ]; then
            ARGS+=(--topic "$TOPIC")
          fi
          if [ "$UPLOAD" = "true" ]; then
            if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET_VALUE" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
              ARGS+=(--upload --privacy private)
            else
              echo "::warning::YouTube OAuth secrets missing; generating review MP4 without upload"
            fi
          fi
          python scripts/run_short.py "${ARGS[@]}"

      - name: Keep preview for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-review-${{ github.run_id }}
          path: output/runs/kids_learning_*/short.mp4
          if-no-files-found: warn
          retention-days: 7

      # Save history so next run knows what stories already exist
      - name: Save history cache
        uses: actions/cache/save@v4
        if: always() && steps.prerequisites.outputs.ready == 'true' && (github.event_name == 'schedule' || !inputs.smoke_test_only)
        with:
          path: output/history/
          key: story-history-kids_learning-${{ github.run_id }}
